<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=https://www.springerfamilybrands.com/">
  <link rel="canonical" href="https://www.springerfamilybrands.com/">
  <meta name="robots" content="noindex">
  <title>Springer Family Brands</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #0a1f44;
      color: #ffffff;
      text-align: center;
    }
    a { color: #c9a84c; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
  <script>
    /* Carry the path through, so an old deep link lands somewhere sensible
       rather than dumping every visitor on the home page. */
    window.location.replace("https://www.springerfamilybrands.com"
      + window.location.pathname + window.location.search + window.location.hash);
  </script>
</head>
<body>
  <p>Springer Family Brands has moved to
     <a href="https://www.springerfamilybrands.com/">springerfamilybrands.com</a>.</p>
</body>
</html>
